<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="security-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#security-bg)" rx="8"/>
  
  <!-- Shield/Security icon -->
  <path d="M150 30 L170 40 Q180 45 180 55 L180 90 Q180 110 150 120 Q120 110 120 90 L120 55 Q120 45 130 40 Z" 
        fill="url(#shield-grad)" opacity="0.9"/>
  
  <!-- Lock inside shield -->
  <rect x="142" y="70" width="16" height="20" fill="white" rx="2" opacity="0.9"/>
  <path d="M145 70 Q145 65 150 65 Q155 65 155 70" stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
  <circle cx="150" cy="80" r="2" fill="#1d4ed8"/>
  
  <!-- Digital key elements -->
  <rect x="50" y="140" width="200" height="3" fill="#22d3ee" rx="1" opacity="0.6"/>
  <rect x="60" y="150" width="180" height="2" fill="#34d399" rx="1" opacity="0.5"/>
  <rect x="70" y="160" width="160" height="2" fill="#fbbf24" rx="1" opacity="0.4"/>
  
  <!-- Binary code pattern -->
  <text x="40" y="35" fill="#64748b" font-family="monospace" font-size="8" opacity="0.6">01001000</text>
  <text x="200" y="45" fill="#64748b" font-family="monospace" font-size="8" opacity="0.5">11010110</text>
  <text x="30" y="180" fill="#64748b" font-family="monospace" font-size="8" opacity="0.4">10011001</text>
  
  <!-- Connection dots -->
  <circle cx="50" cy="60" r="2" fill="#3b82f6" opacity="0.7"/>
  <circle cx="250" cy="70" r="2" fill="#22d3ee" opacity="0.7"/>
  <circle cx="40" cy="120" r="1.5" fill="#34d399" opacity="0.6"/>
  <circle cx="260" cy="130" r="1.5" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Network lines -->
  <path d="M50 60 L120 55" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <path d="M180 55 L250 70" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>
  
</svg>
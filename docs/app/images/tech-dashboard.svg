<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="building-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#tech-bg)" rx="12"/>
  
  <!-- Network connections -->
  <path d="M50 50 Q150 80 250 50 Q300 70 350 50" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M50 100 Q200 120 350 100" stroke="#34d399" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Buildings - Smart City concept -->
  <rect x="80" y="180" width="20" height="80" fill="url(#building-grad)" rx="2"/>
  <rect x="110" y="150" width="25" height="110" fill="url(#building-grad)" rx="2"/>
  <rect x="145" y="160" width="20" height="100" fill="url(#building-grad)" rx="2"/>
  <rect x="175" y="140" width="30" height="120" fill="url(#building-grad)" rx="2"/>
  <rect x="215" y="170" width="20" height="90" fill="url(#building-grad)" rx="2"/>
  
  <!-- Property markers/pins -->
  <circle cx="100" cy="160" r="3" fill="#fbbf24"/>
  <circle cx="130" cy="135" r="3" fill="#fbbf24"/>
  <circle cx="190" cy="125" r="3" fill="#fbbf24"/>
  
  <!-- Tech elements - Data visualization -->
  <rect x="280" y="80" width="60" height="40" fill="rgba(255,255,255,0.1)" rx="4" stroke="#60a5fa" stroke-width="1"/>
  <rect x="285" y="85" width="50" height="3" fill="#34d399" rx="1"/>
  <rect x="285" y="92" width="35" height="3" fill="#60a5fa" rx="1"/>
  <rect x="285" y="99" width="45" height="3" fill="#fbbf24" rx="1"/>
  <rect x="285" y="106" width="25" height="3" fill="#f87171" rx="1"/>
  
  <!-- Digital nodes -->
  <circle cx="70" cy="80" r="4" fill="#60a5fa" opacity="0.8"/>
  <circle cx="320" cy="180" r="4" fill="#34d399" opacity="0.8"/>
  <circle cx="50" cy="180" r="3" fill="#fbbf24" opacity="0.8"/>
  
  <!-- Rural areas -->
  <path d="M20 220 Q60 200 100 220 Q140 240 180 220" stroke="#22c55e" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M220 240 Q260 220 300 240 Q340 260 380 240" stroke="#22c55e" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Satellite/GPS signal -->
  <circle cx="350" cy="40" r="2" fill="#fbbf24"/>
  <circle cx="350" cy="40" r="8" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  <circle cx="350" cy="40" r="15" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.2"/>
  
  <!-- Title area with tech pattern -->
  <rect x="30" y="30" width="200" height="30" fill="rgba(255,255,255,0.1)" rx="6"/>
  <text x="40" y="50" fill="white" font-family="system-ui" font-size="14" font-weight="600">
    Sistema PGT - Gestão Inteligente
  </text>
</svg>
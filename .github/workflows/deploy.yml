name: 🚀 Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job para build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        
      - name: 🚀 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 📥 Instalar dependências Frontend
        run: |
          cd frontend
          npm ci
          
      - name: 🔨 Build do Frontend React
        run: |
          cd frontend
          npm run build:github
          
      - name: 📋 Preparar estrutura do site
        run: |
          # Criar pasta temporária para GitHub Pages
          mkdir -p pages-build
          
          # Copiar index.html da raiz (MedidaGeo) como página principal
          cp index.html pages-build/
          
          # Copiar build do frontend React para subpasta /app
          cp -r frontend/dist pages-build/app
          
      - name: 📤 Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-build

  # Job para deploy
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 🌐 Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: 🚀 Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job para deploy direto da raiz
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        
      - name: 📤 Upload arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          
      - name: 🌐 Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
<svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="doc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="280" height="180" fill="url(#doc-bg)" rx="8"/>
  
  <!-- Main document -->
  <rect x="40" y="30" width="120" height="120" fill="url(#paper-grad)" rx="4" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Document header -->
  <rect x="50" y="40" width="100" height="8" fill="#3b82f6" rx="2"/>
  <text x="52" y="48" fill="white" font-family="system-ui" font-size="6" font-weight="600">IRTR - RELATÓRIO 2024</text>
  
  <!-- Document lines/content -->
  <rect x="50" y="55" width="80" height="2" fill="#64748b" rx="1" opacity="0.7"/>
  <rect x="50" y="62" width="95" height="2" fill="#64748b" rx="1" opacity="0.6"/>
  <rect x="50" y="69" width="60" height="2" fill="#64748b" rx="1" opacity="0.5"/>
  <rect x="50" y="76" width="85" height="2" fill="#64748b" rx="1" opacity="0.6"/>
  
  <!-- Financial/Tax table representation -->
  <rect x="50" y="90" width="100" height="45" fill="rgba(59, 130, 246, 0.1)" rx="2" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
  
  <!-- Table headers -->
  <rect x="52" y="92" width="96" height="8" fill="#3b82f6" opacity="0.2"/>
  <text x="54" y="98" fill="#1e40af" font-family="system-ui" font-size="5" font-weight="600">Valor VTN</text>
  <text x="90" y="98" fill="#1e40af" font-family="system-ui" font-size="5" font-weight="600">IRTR</text>
  <text x="120" y="98" fill="#1e40af" font-family="system-ui" font-size="5" font-weight="600">Status</text>
  
  <!-- Table rows -->
  <text x="54" y="110" fill="#374151" font-family="system-ui" font-size="5">R$ 125.000</text>
  <text x="90" y="110" fill="#374151" font-family="system-ui" font-size="5">R$ 2.500</text>
  <circle cx="134" cy="107" r="2" fill="#22c55e"/>
  
  <text x="54" y="118" fill="#374151" font-family="system-ui" font-size="5">R$ 85.000</text>
  <text x="90" y="118" fill="#374151" font-family="system-ui" font-size="5">R$ 1.700</text>
  <circle cx="134" cy="115" r="2" fill="#fbbf24"/>
  
  <text x="54" y="126" fill="#374151" font-family="system-ui" font-size="5">R$ 67.000</text>
  <text x="90" y="126" fill="#374151" font-family="system-ui" font-size="5">R$ 1.340</text>
  <circle cx="134" cy="123" r="2" fill="#ef4444"/>
  
  <!-- Chart/Graph -->
  <rect x="180" y="50" width="80" height="80" fill="rgba(255,255,255,0.1)" rx="4" stroke="#34d399" stroke-width="1"/>
  
  <!-- Chart bars -->
  <rect x="190" y="100" width="8" height="20" fill="url(#chart-grad)" rx="1"/>
  <rect x="205" y="90" width="8" height="30" fill="url(#chart-grad)" rx="1"/>
  <rect x="220" y="80" width="8" height="40" fill="url(#chart-grad)" rx="1"/>
  <rect x="235" y="95" width="8" height="25" fill="url(#chart-grad)" rx="1"/>
  
  <!-- Chart title -->
  <text x="185" y="65" fill="#34d399" font-family="system-ui" font-size="8" font-weight="600">Evolução IRTR</text>
  
  <!-- Digital stamps/seals -->
  <circle cx="200" cy="35" r="8" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,1" opacity="0.8"/>
  <text x="195" y="39" fill="#fbbf24" font-family="system-ui" font-size="5" font-weight="600">INCRA</text>
  
  <!-- QR Code representation -->
  <rect x="50" y="140" width="15" height="15" fill="#1f2937" rx="1"/>
  <rect x="52" y="142" width="2" height="2" fill="white"/>
  <rect x="55" y="142" width="2" height="2" fill="white"/>
  <rect x="58" y="142" width="2" height="2" fill="white"/>
  <rect x="61" y="142" width="2" height="2" fill="white"/>
  <rect x="52" y="145" width="2" height="2" fill="white"/>
  <rect x="58" y="145" width="2" height="2" fill="white"/>
  <rect x="52" y="148" width="2" height="2" fill="white"/>
  <rect x="55" y="148" width="2" height="2" fill="white"/>
  <rect x="61" y="148" width="2" height="2" fill="white"/>
  <rect x="52" y="151" width="2" height="2" fill="white"/>
  <rect x="58" y="151" width="2" height="2" fill="white"/>
  <rect x="61" y="151" width="2" height="2" fill="white"/>
  
  <!-- Digital signature line -->
  <path d="M75 145 Q90 140 105 145" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.6"/>
  <text x="75" y="155" fill="#64748b" font-family="system-ui" font-size="4">Assinatura Digital</text>
  
  <!-- Network/Connection elements -->
  <circle cx="30" cy="60" r="2" fill="#3b82f6" opacity="0.7"/>
  <circle cx="250" cy="40" r="2" fill="#34d399" opacity="0.7"/>
  <circle cx="20" cy="130" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="260" cy="160" r="1.8" fill="#f87171" opacity="0.6"/>
  
  <!-- Connection lines -->
  <path d="M30 60 Q35 55 40 50" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M250 40 Q240 45 220 50" stroke="#34d399" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
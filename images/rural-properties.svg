<svg width="320" height="240" viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rural-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="sun-grad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="320" height="120" fill="#3b82f6" rx="8 8 0 0"/>
  <!-- Ground -->
  <rect y="120" width="320" height="120" fill="url(#rural-bg)" rx="0 0 8 8"/>
  
  <!-- Sun -->
  <circle cx="280" cy="40" r="20" fill="url(#sun-grad)"/>
  
  <!-- Mountains/Hills -->
  <path d="M0 120 Q80 80 160 120 Q240 90 320 120 L320 240 L0 240 Z" fill="#166534"/>
  
  <!-- Fields with tech grid -->
  <rect x="20" y="160" width="60" height="40" fill="#22c55e" opacity="0.8" rx="2"/>
  <rect x="90" y="170" width="50" height="35" fill="#16a34a" opacity="0.8" rx="2"/>
  <rect x="150" y="155" width="65" height="45" fill="#15803d" opacity="0.8" rx="2"/>
  <rect x="225" y="165" width="55" height="40" fill="#22c55e" opacity="0.8" rx="2"/>
  
  <!-- GPS/Tech overlay on fields -->
  <g opacity="0.6">
    <line x1="20" y1="180" x2="80" y2="180" stroke="#fbbf24" stroke-width="1"/>
    <line x1="50" y1="160" x2="50" y2="200" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="35" cy="175" r="2" fill="#fbbf24"/>
    <circle cx="65" cy="185" r="2" fill="#fbbf24"/>
  </g>
  
  <!-- Satellite/Drone -->
  <ellipse cx="200" cy="50" rx="8" ry="3" fill="#e5e7eb"/>
  <rect x="196" y="48" width="8" height="2" fill="#6b7280"/>
  <circle cx="190" cy="50" r="1" fill="#3b82f6"/>
  <circle cx="210" cy="50" r="1" fill="#3b82f6"/>
  
  <!-- Signal waves -->
  <path d="M200 60 Q210 70 200 80 Q190 70 200 60" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M200 65 Q205 70 200 75 Q195 70 200 65" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.7"/>
  
  <!-- Property boundaries -->
  <path d="M20 160 L280 155 L285 205 L15 210 Z" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="2,2"/>
  
  <!-- Trees -->
  <circle cx="40" cy="140" r="8" fill="#166534"/>
  <rect x="38" y="140" width="4" height="15" fill="#a3a3a3"/>
  <circle cx="270" cy="135" r="10" fill="#166534"/>
  <rect x="268" y="135" width="4" height="18" fill="#a3a3a3"/>
  
  <!-- Digital elements -->
  <rect x="250" y="20" width="50" height="25" fill="rgba(255,255,255,0.9)" rx="3"/>
  <text x="252" y="30" fill="#166534" font-family="system-ui" font-size="8" font-weight="600">Área: 125ha</text>
  <text x="252" y="40" fill="#166534" font-family="system-ui" font-size="8">Status: Regular</text>
</svg>
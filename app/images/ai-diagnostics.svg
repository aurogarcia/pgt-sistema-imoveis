<svg width="280" height="200" viewBox="0 0 280 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brain-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="brain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="neural-glow">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="280" height="200" fill="url(#brain-bg)" rx="8"/>
  
  <!-- AI Brain representation -->
  <path d="M140 40 Q120 30 110 50 Q105 70 120 85 Q140 95 160 85 Q175 70 170 50 Q160 30 140 40 Z" 
        fill="url(#brain-grad)" opacity="0.8"/>
  
  <!-- Neural network connections -->
  <g opacity="0.6">
    <!-- Main neural nodes -->
    <circle cx="125" cy="60" r="3" fill="#60a5fa"/>
    <circle cx="155" cy="65" r="3" fill="#22d3ee"/>
    <circle cx="140" cy="80" r="3" fill="#34d399"/>
    <circle cx="130" cy="75" r="2.5" fill="#fbbf24"/>
    <circle cx="150" cy="55" r="2.5" fill="#f472b6"/>
    
    <!-- Connections -->
    <path d="M125 60 Q135 65 140 80" stroke="#60a5fa" stroke-width="1" fill="none"/>
    <path d="M155 65 Q145 70 140 80" stroke="#22d3ee" stroke-width="1" fill="none"/>
    <path d="M130 75 Q135 77 140 80" stroke="#fbbf24" stroke-width="1" fill="none"/>
    <path d="M150 55 Q145 60 140 80" stroke="#f472b6" stroke-width="1" fill="none"/>
    <path d="M125 60 Q140 58 155 65" stroke="#60a5fa" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Data analysis panels -->
  <rect x="30" y="120" width="70" height="60" fill="rgba(255,255,255,0.1)" rx="4" stroke="#34d399" stroke-width="1"/>
  <text x="35" y="135" fill="#34d399" font-family="system-ui" font-size="10" font-weight="600">Diagnóstico</text>
  <rect x="35" y="140" width="45" height="3" fill="#22c55e" rx="1"/>
  <rect x="35" y="147" width="30" height="3" fill="#fbbf24" rx="1"/>
  <rect x="35" y="154" width="55" height="3" fill="#60a5fa" rx="1"/>
  <rect x="35" y="161" width="20" height="3" fill="#f87171" rx="1"/>
  <text x="35" y="175" fill="white" font-family="system-ui" font-size="8">Status: 87% Regular</text>
  
  <!-- AI Prediction panel -->
  <rect x="180" y="120" width="70" height="60" fill="rgba(255,255,255,0.1)" rx="4" stroke="#8b5cf6" stroke-width="1"/>
  <text x="185" y="135" fill="#a855f7" font-family="system-ui" font-size="10" font-weight="600">Previsão IA</text>
  
  <!-- Progress bars -->
  <rect x="185" y="140" width="35" height="2" fill="#8b5cf6" rx="1"/>
  <rect x="185" y="147" width="50" height="2" fill="#22d3ee" rx="1"/>
  <rect x="185" y="154" width="25" height="2" fill="#34d399" rx="1"/>
  
  <text x="185" y="168" fill="white" font-family="system-ui" font-size="8">Confiança: 94%</text>
  <text x="185" y="176" fill="white" font-family="system-ui" font-size="8">Precisão: 91%</text>
  
  <!-- Neural pulse animation elements -->
  <circle cx="60" cy="40" r="2" fill="#60a5fa" opacity="0.7"/>
  <circle cx="220" cy="35" r="1.5" fill="#22d3ee" opacity="0.6"/>
  <circle cx="40" cy="80" r="1.8" fill="#34d399" opacity="0.5"/>
  <circle cx="240" cy="90" r="2.2" fill="#fbbf24" opacity="0.8"/>
  
  <!-- Data flow lines -->
  <path d="M60 40 Q100 35 125 60" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M220 35 Q180 45 155 65" stroke="#22d3ee" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M40 80 Q90 82 130 75" stroke="#34d399" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M240 90 Q180 75 150 55" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.4"/>
  
  <!-- Binary matrix effect -->
  <g opacity="0.3">
    <text x="20" y="20" fill="#22d3ee" font-family="monospace" font-size="6">10110101</text>
    <text x="200" y="25" fill="#34d399" font-family="monospace" font-size="6">11001010</text>
    <text x="15" y="190" fill="#60a5fa" font-family="monospace" font-size="6">01011100</text>
    <text x="220" y="185" fill="#fbbf24" font-family="monospace" font-size="6">10011101</text>
  </g>
</svg>